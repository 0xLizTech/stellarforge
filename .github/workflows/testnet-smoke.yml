name: Testnet Smoke

# Deploys the Phase 1 contracts to testnet and runs the SDK against them over
# real Soroban RPC.
#
# This is the only thing that exercises the wire format. `sdk-ci` stubs
# `simulateTransaction`, so it passes identically on any stellar-sdk version no
# matter what changed underneath — see #25.
#
# Manual only for now. Worth adding a weekly schedule once it has run green a
# few times, so protocol or SDK drift surfaces on its own; a cron that fails
# every week before it has ever passed is just noise.
on:
  workflow_dispatch:

# No secret is needed. Testnet accounts are funded by friendbot, so the run
# generates a throwaway keypair and discards it with the runner.
permissions:
  contents: read

env:
  # Keep in step with the soroban-sdk major in Cargo.toml, as contracts-ci does.
  STELLAR_CLI_VERSION: "27.1.0"
  # sha256 of that version's x86_64-unknown-linux-gnu tarball. Change it with
  # the version; the install step refuses a mismatch.
  STELLAR_CLI_SHA256: "9915fe63753d7154c26bb9e6410cf1d1ff9727a9b378e663c2790ab7a266af94"
  NETWORK: testnet
  DEPLOYER: ci-deployer

jobs:
  smoke:
    name: Deploy and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # rustup installs the exact toolchain, target and components pinned in
      # rust-toolchain.toml, so CI builds what a release is reproduced from.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Same pinned release tarball contracts-ci uses. Building the CLI from
      # source would add ten minutes for no benefit.
      # Checked against STELLAR_CLI_SHA256 before extraction, so a swapped or
      # tampered release asset fails here instead of building deployable wasm.
      - name: Install stellar-cli
        run: |
          curl -sSfL -o stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${STELLAR_CLI_SHA256}  stellar-cli.tar.gz" | sha256sum --check --strict
          tar xzf stellar-cli.tar.gz -C /usr/local/bin stellar
          rm stellar-cli.tar.gz
          stellar --version

      # No --global: stellar-cli 27 dropped it, and keys now always land in the
      # CLI config dir, so the later steps that change working-directory still
      # resolve the alias.
      - name: Generate and fund a throwaway deployer
        run: |
          stellar keys generate "$DEPLOYER" --network "$NETWORK"
          stellar keys fund "$DEPLOYER" --network "$NETWORK"
          DEPLOYER_ADDRESS=$(stellar keys address "$DEPLOYER")
          echo "DEPLOYER_ADDRESS=$DEPLOYER_ADDRESS" >> "$GITHUB_ENV"
          echo "Deployer: $DEPLOYER_ADDRESS"

      # Runs the real scripts/deploy.sh rather than reimplementing it, so this
      # is also the only place that script is exercised. Each contract takes
      # its admin as a constructor argument, so this one step both deploys and
      # configures: there are no separate initialize steps to get wrong, and no
      # deployed-but-unconfigured state for the smoke test to run against.
      - name: Deploy and configure contracts
        env:
          ASSET_NAME: CI Smoke REIT
          ASSET_SYMBOL: CI-SMOKE
          ASSET_MAX_SUPPLY: "1000000000000"
        run: STELLAR_ACCOUNT="$DEPLOYER" NETWORK="$NETWORK" ./scripts/deploy.sh

      - name: Read the deployed contract ids
        run: |
          for key in rwaAsset compliance registry governance; do
            id=$(jq -r ".contracts.$key" deployed-contracts.json)
            echo "${key}=${id}" >> "$GITHUB_ENV"
            echo "$key: $id"
          done

      # metadata() panicked with NotInitialized whenever the deploy and the
      # initialize call got out of step, which is exactly what the constructor
      # removes. Reading it here proves the constructor ran and stored what it
      # was given, before the SDK is asked to read the same thing.
      - name: Check the deployment is configured
        run: |
          stellar contract invoke --id "$rwaAsset" --network "$NETWORK" \
            --source "$DEPLOYER" --send=no -- metadata
          stellar contract invoke --id "$compliance" --network "$NETWORK" \
            --source "$DEPLOYER" --send=no -- admin

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      # The deployer is used as the holder so balance and allowance are read
      # against a real funded account rather than an arbitrary address.
      - name: Run the smoke test
        working-directory: sdk
        env:
          SMOKE_RWA_ASSET_ID: ${{ env.rwaAsset }}
          SMOKE_COMPLIANCE_ID: ${{ env.compliance }}
          SMOKE_HOLDER_ADDRESS: ${{ env.DEPLOYER_ADDRESS }}
        run: npm run test:smoke

      # Runs after the read smoke test, so reads see the deployment untouched.
      #
      # The write test needs three parties: the deployer as issuer, a funded
      # spender to sign transfer_from and burn_from, and a recipient that is
      # never funded, since contract balances need no account. Compliance is
      # switched on with KYC records for the issuer and the recipient, so mint,
      # transfer and transfer_from all go through the real cross-contract
      # screen. The spender moves tokens it does not own and is not screened.
      - name: Prepare the write smoke test
        run: |
          stellar keys generate ci-spender --network "$NETWORK"
          stellar keys fund ci-spender --network "$NETWORK"
          stellar keys generate ci-recipient --network "$NETWORK"
          RECIPIENT_ADDRESS=$(stellar keys address ci-recipient)
          echo "RECIPIENT_ADDRESS=$RECIPIENT_ADDRESS" >> "$GITHUB_ENV"

          invoke() { stellar contract invoke --network "$NETWORK" --source "$DEPLOYER" "$@"; }
          invoke --id "$rwaAsset" -- set_issuer --issuer "$DEPLOYER_ADDRESS" --approved true
          # Option<Address> is read as JSON, so the id goes in as a quoted string.
          invoke --id "$rwaAsset" -- set_compliance --compliance "\"$compliance\"" --min_level 1
          for subject in "$DEPLOYER_ADDRESS" "$RECIPIENT_ADDRESS"; do
            invoke --id "$compliance" -- set_kyc --subject "$subject" \
              --record '{ "expires_at": 0, "jurisdiction": "US", "level": 1 }'
          done

      # Mints, moves and burns tokens and spends fees on the contracts deployed
      # above. The secrets are throwaway testnet keys, read inside this step only
      # and masked, rather than exported to the whole job.
      - name: Run the write smoke test
        working-directory: sdk
        env:
          SMOKE_WRITE_RWA_ASSET_ID: ${{ env.rwaAsset }}
          SMOKE_WRITE_RECIPIENT_ADDRESS: ${{ env.RECIPIENT_ADDRESS }}
          SMOKE_WRITE_SCREENED: "true"
          # A throwaway deployment, so the admin handover can run too.
          SMOKE_WRITE_TRANSFER_ADMIN: "true"
        run: |
          SMOKE_WRITE_ISSUER_SECRET=$(stellar keys secret "$DEPLOYER")
          SMOKE_WRITE_SPENDER_SECRET=$(stellar keys secret ci-spender)
          echo "::add-mask::$SMOKE_WRITE_ISSUER_SECRET"
          echo "::add-mask::$SMOKE_WRITE_SPENDER_SECRET"
          export SMOKE_WRITE_ISSUER_SECRET SMOKE_WRITE_SPENDER_SECRET
          npm run test:smoke:write

      # The contract ids outlive the run and are useful for reproducing a
      # failure by hand against the same deployment.
      - name: Upload the deployment record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployed-contracts
          path: deployed-contracts.json
          retention-days: 7
