name: Changelog

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    name: Require unreleased changelog entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check changelog entry for code changes
        run: node scripts/check-changelog.cjs "${{ github.event.pull_request.base.sha }}"
