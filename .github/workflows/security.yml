name: Security Audit

on:
  schedule:
    # Run weekly on Mondays at 09:00 UTC, so advisories published against
    # dependencies that have not changed still surface.
    - cron: "0 9 * * 1"
  push:
    branches: [main]
    paths: &dependency-paths
      - "contracts/**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "sdk/package.json"
      - "sdk/package-lock.json"
      - ".github/workflows/security.yml"
  workflow_dispatch:
  # Audit before merge, not only after. Without this trigger the
  # dependency-review job could never run, since it is gated on pull_request.
  pull_request:
    branches: [main, develop]
    paths: *dependency-paths

permissions:
  contents: read
  pull-requests: read

jobs:
  cargo-audit:
    name: Cargo Audit (Rust advisory database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pinned and --locked, so the auditor is the same build on every run.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Run audit
        run: cargo audit

  npm-audit:
    name: npm Audit (SDK runtime dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # Reads package-lock.json, so no install is needed. --omit=dev limits it
      # to what ships in the published package.
      - name: Run audit
        working-directory: sdk
        run: npm audit --omit=dev

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/dependency-review-action@72eb423297a7cc29376c3e0026574f1a203f9052 # v4.5.0
