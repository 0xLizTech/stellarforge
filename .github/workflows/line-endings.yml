name: Line Endings

# Guards the LF normalization declared in .gitattributes. A file committed with
# CRLF (typically from a Windows checkout without the attributes applied) breaks
# scripts/deploy.sh on Linux CI, so it is rejected here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check-crlf:
    name: No CRLF in tracked text files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # `git ls-files --eol` reports the index end-of-line for every tracked
      # file. "i/crlf" or "i/mixed" means CRLF reached the repository.
      - name: Assert no CRLF in the index
        run: |
          offenders="$(git ls-files --eol | grep -E '^i/(crlf|mixed)' || true)"
          if [ -n "$offenders" ]; then
            echo "Files committed with CRLF line endings:"
            echo "$offenders"
            echo
            echo "Fix with: git add --renormalize . && git commit"
            exit 1
          fi
          echo "All tracked text files use LF."
