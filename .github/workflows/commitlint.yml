name: Commitlint

# Enforces the Conventional Commits style documented in CONTRIBUTING.md.
# A pull request whose commits do not conform fails this check.
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  commitlint:
    name: Lint PR commit messages
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 so the full PR commit range is available to lint.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      # Pinned versions so the linter is identical on every run. These are dev
      # tools only and are not added to any package manifest.
      - name: Install commitlint
        run: npm install --no-save @commitlint/cli@19.8.1 @commitlint/config-conventional@19.8.1

      - name: Lint commits in range
        run: |
          npx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
