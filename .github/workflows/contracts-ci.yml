name: Contracts CI

on:
  push:
    branches: [main, develop]
    paths: &contracts-paths
      - "contracts/**"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "sdk/tests/fixtures/oracle-parity-table.json"
      - "scripts/generate-oracle-parity-table.cjs"
      - "scripts/check-soroban-sdk-version.cjs"
      - "scripts/check-wasm-size.cjs"
      - ".github/workflows/contracts-ci.yml"
  pull_request:
    branches: [main, develop]
    paths: *contracts-paths

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep in step with the soroban-sdk major in Cargo.toml.
  STELLAR_CLI_VERSION: "27.1.0"
  # sha256 of that version's x86_64-unknown-linux-gnu tarball. Change it with
  # the version; the install step refuses a mismatch.
  STELLAR_CLI_SHA256: "9915fe63753d7154c26bb9e6410cf1d1ff9727a9b378e663c2790ab7a266af94"

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rustup installs the exact toolchain, target and components pinned in
      # rust-toolchain.toml, so CI builds what a release is reproduced from.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check soroban-sdk version consistency
        run: node scripts/check-soroban-sdk-version.cjs

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rustup installs the exact toolchain, target and components pinned in
      # rust-toolchain.toml, so CI builds what a release is reproduced from.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run tests
        run: cargo test --all --features testutils

      # Fails if sdk/tests/fixtures/oracle-parity-table.json drifts from a fresh
      # run of the generator that calls oracle_adapter::tick_of /
      # check_price_deviation (same pure fns as the contract methods).
      - name: Oracle SDK parity fixture drift check
        run: |
          cargo test -p oracle-adapter --features testutils \
            test_generate_sdk_parity_table -- --exact

  build-wasm:
    name: Build WASM Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # rustup installs the exact toolchain, target and components pinned in
      # rust-toolchain.toml, so CI builds what a release is reproduced from.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Checked against STELLAR_CLI_SHA256 before extraction, so a swapped or
      # tampered release asset fails here instead of building deployable wasm.
      - name: Install stellar-cli
        run: |
          curl -sSfL -o stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${STELLAR_CLI_SHA256}  stellar-cli.tar.gz" | sha256sum --check --strict
          tar xzf stellar-cli.tar.gz -C /usr/local/bin stellar
          rm stellar-cli.tar.gz
          stellar --version

      - name: Build contracts
        run: |
          stellar contract build --manifest-path contracts/rwa-asset/Cargo.toml
          stellar contract build --manifest-path contracts/registry/Cargo.toml
          stellar contract build --manifest-path contracts/compliance/Cargo.toml
          stellar contract build --manifest-path contracts/governance/Cargo.toml
          stellar contract build --manifest-path contracts/oracle-adapter/Cargo.toml

      # Published with the artifacts, so the hash of a deployed contract's wasm
      # can be checked against the commit that built it.
      - name: Record wasm checksums
        working-directory: target/wasm32v1-none/release
        run: sha256sum *.wasm | tee SHA256SUMS

      - name: Extract base size budget for delta calculation
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git cat-file -e FETCH_HEAD:contracts/size-budget.json 2>/dev/null; then
            git show FETCH_HEAD:contracts/size-budget.json > /tmp/base-size-budget.json
          fi

      - name: Check contract WASM sizes against budget
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_ARG=""
          if [ -f /tmp/base-size-budget.json ]; then
            BASE_ARG="--base /tmp/base-size-budget.json"
          fi
          node scripts/check-wasm-size.cjs \
            --budget contracts/size-budget.json \
            --wasm-dir target/wasm32v1-none/release \
            --output-markdown target/wasm32v1-none/release/wasm-size-report.md \
            --output-json target/wasm32v1-none/release/wasm-sizes.json \
            --post-pr-comment \
            $BASE_ARG

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: contract-wasm
          path: |
            target/wasm32v1-none/release/*.wasm
            target/wasm32v1-none/release/SHA256SUMS
            target/wasm32v1-none/release/wasm-size-report.md
            target/wasm32v1-none/release/wasm-sizes.json
          retention-days: 7
