name: Link Checker

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/link-checker.yml"
      - ".lycheeignore"
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/link-checker.yml"
      - ".lycheeignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-checker:
    name: Markdown Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            lychee-cache-${{ runner.os }}-

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --cache --max-cache-age 1d --exclude-file .lycheeignore '**/*.md'
          fail: true
