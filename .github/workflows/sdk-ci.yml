name: SDK CI

on:
  push:
    branches: [main, develop]
    paths:
      - "sdk/**"
      - "contracts/oracle-adapter/**"
      - "scripts/generate-oracle-parity-table.cjs"
      - ".github/workflows/sdk-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "sdk/**"
      - "contracts/oracle-adapter/**"
      - "scripts/generate-oracle-parity-table.cjs"

jobs:
  oracle-parity:
    name: Oracle parity fixture (Rust → JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ runner.os }}-oracle-parity-${{ hashFiles('**/Cargo.lock') }}

      # Regenerates nothing; asserts the committed fixture matches values from
      # oracle_adapter::tick_of / check_price_deviation (contract pure math).
      - name: Validate oracle-parity-table.json against contract math
        run: |
          cargo test -p oracle-adapter --features testutils \
            test_generate_sdk_parity_table -- --exact

  test:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    needs: [oracle-parity]
    strategy:
      matrix:
        node-version: ["22", "24"]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Type check
        working-directory: sdk
        run: npm run typecheck

      - name: Run tests
        working-directory: sdk
        run: npm test

  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Build
        working-directory: sdk
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: sdk-dist
          path: sdk/dist/
          retention-days: 7
