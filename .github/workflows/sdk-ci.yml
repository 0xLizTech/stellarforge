name: SDK CI

on:
  push:
    branches: [main, develop]
    paths:
      - "sdk/**"
      - "contracts/oracle-adapter/**"
      - "scripts/generate-oracle-parity-table.cjs"
      - ".github/workflows/sdk-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "sdk/**"
      - "contracts/oracle-adapter/**"
      - "scripts/generate-oracle-parity-table.cjs"

jobs:
  oracle-parity:
    name: Oracle parity fixture (Rust → JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ runner.os }}-oracle-parity-${{ hashFiles('**/Cargo.lock') }}

      # Regenerates nothing; asserts the committed fixture matches values from
      # oracle_adapter::tick_of / check_price_deviation (contract pure math).
      - name: Validate oracle-parity-table.json against contract math
        run: |
          cargo test -p oracle-adapter --features testutils \
            test_generate_sdk_parity_table -- --exact

  test:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    needs: [oracle-parity]
    strategy:
      matrix:
        # 22.13 satisfies the lint toolchain's engine floor while staying close
        # to the package's 22.12 runtime minimum. 24 is the current LTS line.
        # Node 20 is below the floor: the
        # CommonJS build requires ESM-only deps, which Node supports without a
        # flag only from 22.12.
        node-version: ["22.13", "24"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Lint
        working-directory: sdk
        run: npm run lint

      - name: Type check
        working-directory: sdk
        run: npm run typecheck

      - name: Typecheck runnable examples
        working-directory: sdk
        run: npm run examples:check

      - name: Run tests
        working-directory: sdk
        run: npm test

  alternate-runtimes:
    name: Deno and Bun SDK Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.x"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.x"
      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci
      - name: Build SDK package
        working-directory: sdk
        run: npm run build
      - name: Deno read smoke test
        run: deno run --allow-read --allow-env sdk/runtime-smoke.mjs
      - name: Bun read smoke test
        run: bun run sdk/runtime-smoke.mjs

  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Build
        working-directory: sdk
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf6581a12fe42986043a # v4.4.3
        with:
          name: sdk-dist
          path: sdk/dist/
          retention-days: 7
