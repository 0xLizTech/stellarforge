[workspace]
members = [
    "contracts/common",
    "contracts/rwa-asset",
    "contracts/registry",
    "contracts/compliance",
    "contracts/governance",
]
resolver = "2"

[workspace.dependencies]
soroban-sdk = { version = "27.0.5" }
stellarforge-common = { path = "contracts/common" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
