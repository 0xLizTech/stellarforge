[package]
name = "rwa-asset"
version = "0.1.0"
edition = "2021"
authors = ["StellarForge Contributors"]
description = "Core RWA asset contract for the StellarForge protocol"
license = "Apache-2.0"
repository = "https://github.com/0xLizTech/stellarforge"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
