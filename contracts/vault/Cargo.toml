[package]
name = "vault"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }
stellarforge-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
rwa-asset = { path = "../rwa-asset", features = ["testutils"] }
compliance = { path = "../compliance", features = ["testutils"] }
oracle-adapter = { path = "../oracle-adapter", features = ["testutils"] }
